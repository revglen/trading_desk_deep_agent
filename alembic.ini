[alembic]
script_location = migrations
prepend_sys_path = . src
version_path_separator = os

# sqlalchemy.url is intentionally left unset here - migrations/env.py builds
# it from trading_desk.config.get_settings() (DATABASE_URL if set, else the
# local SQLite APP_DB_PATH), so `alembic upgrade head` always targets
# whatever the app itself would connect to.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
